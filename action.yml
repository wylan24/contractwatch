name: contractwatch
description: 'Catch breaking changes in OpenAPI specs on pull requests: removed fields, changed types, new required parameters.'
author: wylan24
branding:
  icon: shield
  color: orange

inputs:
  spec:
    description: 'OpenAPI spec(s) to check, relative to the repository root. One per line (or space-separated); globs like `api/**/openapi.yaml` work.'
    required: true
  base:
    description: 'Git ref to compare against. Defaults to the pull request base branch, or the previous commit on push.'
    default: ''
  fail-on:
    description: 'Fail the job on: breaking (default), warning, never.'
    default: breaking
  comment:
    description: 'Post one comment per spec on the pull request, updated in place on each push (needs `pull-requests: write`).'
    default: 'true'
  upload-sarif:
    description: 'Upload changes to GitHub code scanning (needs `security-events: write`).'
    default: 'false'
  sarif-category:
    description: 'Code scanning category, to keep several contractwatch jobs apart.'
    default: contractwatch
  token:
    description: 'GitHub token for the PR comment.'
    default: ${{ github.token }}

outputs:
  exit-code:
    description: '0 passed, 1 failing changes found, 2 contractwatch itself failed (the worst across specs).'
    value: ${{ steps.run.outputs.exit-code }}
  breaking:
    description: 'Number of breaking changes, across all specs, not counting accepted ones.'
    value: ${{ steps.run.outputs.breaking }}
  report-dir:
    description: 'Folder with one subfolder per spec, each holding report.json, report.md and report.sarif.'
    value: ${{ steps.run.outputs.dir }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: Install contractwatch
      shell: bash
      working-directory: ${{ github.action_path }}
      # runtime dependencies only; Node 22.18+ runs the TypeScript sources directly
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

    - name: Fetch the base revision
      id: base
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        PR_BASE: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
      run: |
        if [ -n "$INPUT_BASE" ]; then ref="$INPUT_BASE"
        elif [ -n "$PR_BASE" ]; then
          git fetch --no-tags --depth=1 origin "+refs/heads/$PR_BASE:refs/remotes/origin/$PR_BASE"
          ref="origin/$PR_BASE"
        elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
          git fetch --no-tags --depth=1 origin "$BEFORE"
          ref="$BEFORE"
        else
          echo "::error::No base to compare against; set the \`base\` input."
          exit 2
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - name: Compare
      id: run
      shell: bash
      env:
        NO_COLOR: '1'
        SPECS: ${{ inputs.spec }}
        BASE: ${{ steps.base.outputs.ref }}
        FAIL_ON: ${{ inputs.fail-on }}
        OUT: ${{ runner.temp }}/contractwatch
      run: |
        shopt -s globstar nullglob
        rm -rf "$OUT" && mkdir -p "$OUT"
        specs=()
        while IFS= read -r line; do
          for pattern in $line; do
            matched=($pattern)
            if [ ${#matched[@]} -eq 0 ]; then echo "::warning::No spec matches \`$pattern\`"; fi
            specs+=("${matched[@]}")
          done
        done <<< "$SPECS"

        worst=0
        breaking=0
        n=0
        for spec in "${specs[@]}"; do
          n=$((n + 1))
          dir="$OUT/$n"
          mkdir -p "$dir"
          echo "$spec" > "$dir/spec"
          echo "::group::$spec"
          set +e
          node "$GITHUB_ACTION_PATH/src/cli.ts" diff "$spec" --base "$BASE" --fail-on "$FAIL_ON" \
            --markdown "$dir/report.md" --json "$dir/report.json" --sarif "$dir/report.sarif"
          code=$?
          set -e
          echo "::endgroup::"
          if [ "$code" -gt "$worst" ]; then worst=$code; fi
          if [ -f "$dir/report.md" ]; then
            cat "$dir/report.md" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            breaking=$((breaking + $(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).summary.breaking" "$dir/report.json")))
          elif [ "$code" = 0 ]; then
            echo "✅ \`$spec\` is new since \`$BASE\`; nothing to compare." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::contractwatch failed on $spec"
          fi
        done
        if [ "$n" = 0 ]; then echo "::error::No OpenAPI specs found for: $SPECS"; worst=2; fi

        sarifs=("$OUT"/*/report.sarif)
        if [ ${#sarifs[@]} -gt 0 ]; then node "$GITHUB_ACTION_PATH/src/action/merge-sarif.ts" "$OUT/contractwatch.sarif" "${sarifs[@]}"; fi

        echo "exit-code=$worst" >> "$GITHUB_OUTPUT"
        echo "breaking=$breaking" >> "$GITHUB_OUTPUT"
        echo "dir=$OUT" >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event.pull_request && steps.run.outputs.exit-code != '2' }}
      # pull requests from forks get a read-only token; the job summary still has the report
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR: ${{ github.event.pull_request.number }}
        OUT: ${{ steps.run.outputs.dir }}
      run: |
        comments=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[] | select(.body | startswith("<!-- contractwatch:")) | {id, marker: (.body | split("\n")[0])}')
        for dir in "$OUT"/*/; do
          if [ ! -f "$dir/report.md" ]; then continue; fi
          spec=$(cat "$dir/spec")
          # one comment per spec, found by its hidden marker and edited in place
          marker="<!-- contractwatch:$spec -->"
          body=$(awk -v m="$marker" 'NR == 1 { print m; next } { print }' "$dir/report.md")
          id=$(jq -r --arg m "$marker" 'select(.marker == $m) | .id' <<< "$comments" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          elif grep -q '🔴\|🟡' "$dir/report.md"; then
            # don't add noise to PRs that only make additive changes
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
        done

    - name: Upload to code scanning
      if: ${{ inputs.upload-sarif == 'true' && steps.run.outputs.exit-code != '2' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.run.outputs.dir }}/contractwatch.sarif
        category: ${{ inputs.sarif-category }}

    - name: Result
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
      run: |
        if [ "$CODE" = "2" ]; then echo "::error::contractwatch failed to run"; exit 2; fi
        if [ "$CODE" = "1" ]; then echo "::error::The API contract has changes that will break clients (see the summary)"; exit 1; fi
        exit 0
