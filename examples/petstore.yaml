openapi: 3.0.3
info:
  title: Petstore
  version: 1.1.0
security:
  - apiKey: []
paths:
  /pets:
    get:
      operationId: listPets
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 50
        - name: species
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    get:
      deprecated: true
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /owners:
    get:
      responses:
        '200':
          description: Owners
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: number
        name:
          type: string
        tag:
          type: string
        status:
          type: string
          nullable: true
          enum: [available, sold, pending]
        owner:
          $ref: '#/components/schemas/Owner'
        birthday:
          type: string
          format: date
    Owner:
      type: object
      properties:
        name:
          type: string
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
    NewPet:
      type: object
      required: [name, species]
      properties:
        name:
          type: string
          maxLength: 50
        tag:
          type: string
        kind:
          type: string
          enum: [dog, cat]
        species:
          type: string
